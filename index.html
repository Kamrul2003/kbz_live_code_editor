<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="description" content="KBZ Code Editor is a free online HTML, CSS, and JavaScript editor with live preview. Created by Kamrul.">
  <meta name="author" content="Kamrul2003">
  <link rel="canonical" href="https://kamrul2003.github.io/kbz_live_code_editor/">
  <link rel="shortcut icon" href="images/cel.png" type="image/png">
  <title>KBZ Code Editor | Online HTML CSS JS Editor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="styleW_400.css">
  <link rel="stylesheet" href="styleW_600.css">
  <link rel="stylesheet" href="styleW_1400.css">
</head>
<body>
  <div class="application">
    <div class="header">
      <button class="iconBox textAnim"><i class="fa-solid fa-code"></i></button></button>
      <div class="headerBox" onclick="downloadApp()">
        <h2 class="headding textAnim">KBZ CODE EDITOR</h2>
        <a class="headding textAnim" style="text-decoration: underline;" onclick="openBrowser('https://kamrul2003.github.io/kbz_live_code_editor/')">kamrul2003.github.io/kbz_live_code_editor/</a>
      </div>
    </div>
    <div class="frameBox">
      <nav class="boxHeader">
        <div class="fileGroup">
          <button class="tab" data="HTML" style = "background-image: url('bg.png');"><span class="tabDot tabH"></span><a class="links textAnim">HTML</a></button>
          <button class="tab" data="CSS"><span class="tabDot tabC"></span><a class="links">CSS</a></button>
          <button class="tab" data="JS"><span class="tabDot tabJ"></span><a class="links">JS</a></button>
        </div>
        <div class="commGroup">
          <button class="commnd commndRun"><i class="fa-solid fa-play"></i></button>
          <button class="commnd commndReset"><i class="fa-solid fa-arrow-rotate-left"></i></button>
        </div>
      </nav>
      <div class="CoderBox">

        <!__  HTML CODE EXPLAIN IS HERE  __>
        <textarea class="htmlCoder codeFile" placeholder="Write your HTML code here..." spellcheck="false"><div class="app">
<i>Ex,</i>
<h1>Hellow World</h1>
<p>Welcome to Live Code Editor.</p>
</div>
</textarea>


        <!__  CSS CODE EXPLAIN IS HERE  __>
        <textarea class="cssCoder codeFile" hidden placeholder="Write your CSS code here..." spellcheck="false">*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body{
  width: 100%;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #FFFFFF;
}

i{
  color: #707070;
  font-weight: 1000;
}

h1{
  color: #333;
}

p{
  color: blue;
  font-size: 20px;
  font-weight: 800;
}
</textarea>


        <!__  JS CODE EXPLAIN IS HERE  __>
        <textarea class="jsCoder codeFile" hidden placeholder="Write your JS code here..." spellcheck="false"></textarea>


      </div>
      <div class="OutputBox">
        <div class="title">
          <div class="owner">
            <img src="images/im_3.png" alt="KBZ Logo" class="img1">
            <img src="images/im_1.png" alt="KBZ Logo" class="img2">
            <img src="images/im_2.png" alt="KBZ Logo" class="img3">
          </div>
          <button class="OutputBoxTitle">
            <span class="textAnim">LIVE OUTPUT</span>
          </button>
        </div>
        <iframe class="previewSrc" title="Live Preview"> Hellow Bangladesh </iframe>
      </div>
      <div class="MyLinkings">
        <a>
          <img src="images/fb.png" alt="Facebook" onclick="openApp('https://www.facebook.com/captain.kbz/')">
        </a>
        <a>
          <img src="images/yt.png" alt="YouTube" onclick="openApp('https://www.youtube.com/@captainkbz2003')">
        </a>
        <a>
          <img src="images/wap.png" alt="WhatsApp" onclick="openApp('https://wa.me/8801612098994')">
        </a>
      </div>
    </div>
  </div>
  <script src="App_main.js"></script>
</body>
</html>
